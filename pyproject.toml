[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psir-enrich"
version = "0.5.0"
description = "Enrich OMEGA-PSIR publication XML records with WoS identifiers, PubMed IDs, Scopus IDs, and selected WoS Expanded metadata."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "lowhumlee"},
]
dependencies = [
    "lxml>=4.9",
    "requests>=2.28",
    "pandas>=1.5",
]

[project.optional-dependencies]
gui = [
    "streamlit>=1.30",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
]

[project.scripts]
psir-enrich = "psir_enrich.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
